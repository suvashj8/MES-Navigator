# MES Navigator — full stack or Postgres-only for local dev.
#
# Postgres only (local npm run dev):
#   npm run db:docker
#
# Full app (UI + API + DB):
#   copy .env.docker.example .env.docker   # once, then edit secrets
#   npm run docker:up
#   open http://localhost:8080  (login admin / admin123 after first seed)

services:
  mes-postgres:
    image: postgres:16-alpine
    container_name: mes-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MES_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${MES_DB_PASSWORD:-mes_dev_123}
      POSTGRES_DB: ${MES_DB_NAME:-mes_prototype}
    ports:
      - "${MES_DB_PORT:-55437}:5432"
    volumes:
      - mes_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${MES_DB_USER:-postgres} -d ${MES_DB_NAME:-mes_prototype}",
        ]
      interval: 3s
      timeout: 5s
      retries: 10

  mes-api:
    build:
      context: ..
      dockerfile: mes-prototype/docker/Dockerfile.api
    container_name: mes-api
    restart: unless-stopped
    depends_on:
      mes-postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3101
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${MES_DB_USER:-postgres}:${MES_DB_PASSWORD:-mes_dev_123}@mes-postgres:5432/${MES_DB_NAME:-mes_prototype}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.docker (min 32 chars)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      EXCEL_PATH: /app/data/bead-for-life.xlsx
      STAFF_UPLOAD_DIR: /app/uploads/staff
      MES_AUTO_SEED: ${MES_AUTO_SEED:-1}
      TRUST_PROXY: "1"
    volumes:
      - mes_staff_uploads:/app/uploads/staff
    expose:
      - "3101"

  mes-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: mes-web
    restart: unless-stopped
    depends_on:
      mes-api:
        condition: service_healthy
    ports:
      - "${MES_WEB_PORT:-8080}:80"

volumes:
  mes_pg_data:
  mes_staff_uploads:
