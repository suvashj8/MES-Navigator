name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            mes-prototype/package-lock.json
            mes-prototype/client/package-lock.json
            mes-prototype/server/package-lock.json

      - name: Install (root)
        working-directory: mes-prototype
        run: npm ci

      - name: Install (server)
        working-directory: mes-prototype/server
        run: npm ci

      - name: Install (client)
        working-directory: mes-prototype/client
        run: npm ci

      - name: Build (client)
        working-directory: mes-prototype/client
        run: npm run build

